<!doctype html>
<html>
<head>
<meta charset=utf-8 />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Super Mario</title>
<link href="Content/style.css" rel="stylesheet" />
</head>
<body>
<div id="game">
<div id="world">
</div>
<div id="coinNumber" class="gauge">0</div>
<div id="coin" class="gaugeSprite"></div>
<div id="liveNumber" class="gauge">0</div>
<div id="live" class="gaugeSprite"></div>
<div id="touch-controls">
  <div id="dpad">
    <div id="btn-up" class="ctrl-btn">↑</div>
    <div id="btn-left" class="ctrl-btn">←</div>
    <div id="btn-down" class="ctrl-btn">↓</div>
    <div id="btn-right" class="ctrl-btn">→</div>
  </div>
  <div id="action-btns">
    <div id="btn-jump" class="ctrl-btn">A</div>
    <div id="btn-fire" class="ctrl-btn">B</div>
  </div>
</div>
</div>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.7.2/jquery.min.js"></script>
<script src="Scripts/testlevels.js"></script>
<script src="Scripts/oop.js"></script>
<script src="Scripts/keys.js"></script>
<script src="Scripts/constants.js"></script>
<script src="Scripts/main.js"></script>
</body>
</html>
